<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FIHAS Bot — Setup</title>
<link rel="icon" href="/logo.jpg">
<style>
  :root{
    --bg:#0d0e13; --card:#161822; --card-2:#1d2030; --line:#2a2e42;
    --text:#e9ebf2; --muted:#959bb0; --accent:#5b8cff; --ok:#3ecf8e; --warn:#f0b429; --bad:#f2555a;
    --radius:14px;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--text);
    font:15px/1.55 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased}
  .rainbow{height:4px;background:linear-gradient(90deg,#e40303,#ff8c00,#ffed00,#008026,#24408e,#732982)}
  .wrap{max-width:860px;margin:0 auto;padding:28px 20px 80px}
  header{display:flex;align-items:center;gap:14px;margin-bottom:26px}
  header img{width:52px;height:52px;border-radius:14px;flex:none}
  header h1{margin:0;font-size:20px;letter-spacing:-.01em}
  header .sub{color:var(--muted);font-size:13px;margin-top:2px}
  header .spacer{flex:1}
  .card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:22px;margin-bottom:18px}
  .card h2{margin:0 0 4px;font-size:17px}
  .card .hint{color:var(--muted);font-size:13px;margin:0 0 18px}
  label{display:block;font-size:13px;font-weight:600;margin:16px 0 6px}
  label:first-of-type{margin-top:0}
  input[type=text],input[type=password],input[type=number],select,textarea{
    width:100%;padding:10px 12px;background:var(--card-2);border:1px solid var(--line);
    border-radius:9px;color:var(--text);font:inherit;font-size:14px}
  textarea{min-height:84px;resize:vertical;font-family:ui-monospace,Consolas,monospace;font-size:13px}
  input:focus,select:focus,textarea:focus{outline:2px solid var(--accent);outline-offset:-1px;border-color:transparent}
  .row{display:flex;gap:10px;flex-wrap:wrap}
  .row>*{flex:1;min-width:140px}
  button{padding:10px 16px;border-radius:9px;border:1px solid var(--line);background:var(--card-2);
    color:var(--text);font:inherit;font-weight:600;font-size:14px;cursor:pointer}
  button:hover:not(:disabled){border-color:var(--accent)}
  button:disabled{opacity:.5;cursor:not-allowed}
  button.primary{background:var(--accent);border-color:var(--accent);color:#fff}
  button.primary:hover:not(:disabled){filter:brightness(1.1)}
  button.ghost{background:transparent}
  button.small{padding:6px 11px;font-size:13px}
  .actions{display:flex;gap:10px;justify-content:flex-end;margin-top:22px;flex-wrap:wrap}
  .actions .left{margin-right:auto}
  .steps{display:flex;gap:6px;margin-bottom:22px;flex-wrap:wrap}
  .steps div{flex:1;min-width:40px;height:4px;border-radius:2px;background:var(--line)}
  .steps div.done{background:var(--accent)}
  .pill{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:999px;
    font-size:12px;font-weight:600;background:var(--card-2);border:1px solid var(--line)}
  .pill.ok{color:var(--ok);border-color:#1e5c43}
  .pill.bad{color:var(--bad);border-color:#63262b}
  .pill.warn{color:var(--warn);border-color:#61491a}
  .list{display:flex;flex-direction:column;gap:8px;max-height:280px;overflow-y:auto;padding-right:4px}
  .opt{display:flex;align-items:center;gap:10px;padding:9px 12px;background:var(--card-2);
    border:1px solid var(--line);border-radius:9px;cursor:pointer}
  .opt:hover{border-color:var(--accent)}
  .opt input{margin:0;flex:none;accent-color:var(--accent)}
  .opt .name{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .opt .tag{font-size:11px;color:var(--muted);flex:none}
  .dot{width:9px;height:9px;border-radius:50%;flex:none}
  .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px}
  .stat{background:var(--card-2);border:1px solid var(--line);border-radius:11px;padding:13px 15px}
  .stat .k{font-size:12px;color:var(--muted);margin-bottom:3px}
  .stat .v{font-size:15px;font-weight:600;word-break:break-word}
  .preview{background:#36393f;border-radius:9px;padding:13px 15px;margin-top:10px;
    font-size:14px;white-space:pre-wrap;word-break:break-word}
  .preview .m{color:#c9d5ff;background:#3f4570;border-radius:3px;padding:0 2px}
  .preview a{color:#00a8fc;text-decoration:none}
  .msg{padding:11px 14px;border-radius:9px;font-size:13.5px;margin-bottom:14px;display:none}
  .msg.show{display:block}
  .msg.err{background:#3a1d20;border:1px solid #63262b;color:#ffb4b7}
  .msg.good{background:#14322a;border:1px solid #1e5c43;color:#8bebc0}
  .msg.info{background:#1b2440;border:1px solid #2c3a63;color:#b8caff}
  .urlrow{display:flex;gap:8px;margin-bottom:8px}
  .urlrow input{flex:1}
  /* RSS feed manager */
  .feed{background:var(--card-2);border:1px solid var(--line);border-radius:10px;
    padding:9px 10px;margin-bottom:8px}
  .feed.off{opacity:.62}
  .feed.dupe,.feed.bad{border-color:#63262b}
  .feed .top{display:flex;gap:7px;align-items:center;flex-wrap:wrap}
  .feed .top input[type=text]{flex:1;min-width:180px;background:var(--card);font-size:13px;
    font-family:ui-monospace,Consolas,monospace}
  .feed .top input[type=checkbox]{accent-color:var(--accent);width:17px;height:17px;flex:none}
  .feed .top button{padding:6px 9px;font-size:13px;background:var(--card);flex:none}
  .feed .top button.icon{width:32px;padding:6px 0;text-align:center}
  .feed .tags{display:flex;gap:6px;flex-wrap:wrap;margin-top:7px}
  .feed .tags:empty{display:none}
  .feed .note{font-size:12px;color:var(--muted);margin-top:7px;word-break:break-word}
  .feed .note.bad{color:#ffb4b7}
  .items{margin-top:8px;display:flex;flex-direction:column;gap:5px}
  .item{display:flex;gap:8px;align-items:flex-start;font-size:12.5px;background:var(--card);
    border:1px solid var(--line);border-radius:7px;padding:7px 9px}
  .item .txt{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--muted)}
  .item .when{flex:none;color:var(--muted);font-size:11.5px}
  .results{margin-top:14px;display:flex;flex-direction:column;gap:8px}
  .result{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;background:var(--card-2);
    border:1px solid var(--line);border-radius:9px;font-size:13px}
  .result .body{flex:1;min-width:0}
  .result .src{font-weight:600;word-break:break-all}
  .result .det{color:var(--muted);margin-top:2px;word-break:break-word}
  code{background:var(--card-2);padding:2px 6px;border-radius:5px;font-size:12.5px;
    font-family:ui-monospace,Consolas,monospace}
  a{color:var(--accent)}
  .switch{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:11px 13px;
    background:var(--card-2);border:1px solid var(--line);border-radius:9px;cursor:pointer;margin-bottom:8px}
  .switch .t{font-size:13.5px}
  .switch .d{font-size:12px;color:var(--muted);margin-top:2px}
  .switch input{accent-color:var(--accent);flex:none;width:17px;height:17px}
  .center{text-align:center;padding:34px 0}
  .center h2{margin:0 0 8px}
  .hide{display:none!important}
  /* collapsible quick-edit sections on the dashboard */
  details.card{padding:0}
  details.card>summary{list-style:none;cursor:pointer;padding:15px 20px;display:flex;align-items:center;gap:10px}
  details.card>summary::-webkit-details-marker{display:none}
  details.card>summary:hover{background:var(--card-2)}
  details.card>summary .chev{color:var(--muted);font-size:11px;transition:transform .15s;flex:none}
  details.card[open]>summary .chev{transform:rotate(90deg)}
  details.card>summary .st{font-weight:600;font-size:15px}
  details.card>summary .sv{margin-left:auto;color:var(--muted);font-size:13px;text-align:right;
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:55%}
  details.card[open]>summary{border-bottom:1px solid var(--line)}
  details.card .inner{padding:18px 20px 20px}
  .cmds{font-size:13px;color:var(--muted);line-height:1.9}
  .cmds code{color:var(--text)}
  @media(max-width:560px){.wrap{padding:18px 14px 60px}.card{padding:17px}}
</style>
</head>
<body>
<div class="rainbow"></div>
<div class="wrap">

  <header>
    <img src="/logo.jpg" alt="">
    <div>
      <h1>FIHAS Bot</h1>
      <div class="sub" id="hdrsub">Loading…</div>
    </div>
    <div class="spacer"></div>
    <button class="ghost small hide" id="logout">Log out</button>
  </header>

  <!-- ------------------------------------------------------------ LOGIN -->
  <div id="login" class="card hide">
    <h2>Password required</h2>
    <p class="hint">Set by <code>WEB_PASSWORD</code>, or auto-generated and printed in the container log on first start.</p>
    <div class="msg err" id="loginerr"></div>
    <form id="loginform">
      <label for="pw">Password</label>
      <input type="password" id="pw" autocomplete="current-password" autofocus>
      <div class="actions"><button class="primary" type="submit">Unlock</button></div>
    </form>
  </div>

  <!-- ----------------------------------------------------------- WIZARD -->
  <div id="wizard" class="hide">
    <div class="steps" id="steps"></div>
    <div class="msg err" id="werr"></div>
    <div id="stepbody"></div>
  </div>

  <!-- -------------------------------------------------------- DASHBOARD -->
  <div id="dash" class="hide">
    <div class="msg" id="dashmsg"></div>
    <div class="card">
      <h2>Status</h2>
      <p class="hint">Watching <strong id="dhandle"></strong> · <span id="dstate"></span></p>
      <div class="grid" id="dstats"></div>
      <div class="actions">
        <button class="left" id="dsetup">Re-run setup</button>
        <button id="dtest">Test sources</button>
        <button id="dlatest">Post latest</button>
        <button id="dpause"></button>
        <button class="primary" id="dcheck">Check now</button>
      </div>
      <div class="results" id="dresults"></div>
    </div>
    <div id="dashedit"></div>
  </div>

</div>

<script>
/* ------------------------------------------------------------ plumbing */
const $ = (id) => document.getElementById(id);
let S = null;            // server state
let step = 0;            // wizard step index
let draft = {};          // pending edits within the wizard

async function api(path, body) {
  const res = await fetch(path, {
    method: body === undefined ? 'GET' : 'POST',
    headers: body === undefined ? {} : { 'Content-Type': 'application/json' },
    body: body === undefined ? undefined : JSON.stringify(body)
  });
  if (res.status === 401) { showLogin(); throw new Error('Not authenticated'); }
  const data = await res.json().catch(() => ({}));
  if (!res.ok && data.errors) throw new Error(data.errors.join(' '));
  if (!res.ok && data.error) throw new Error(data.error);
  return data;
}

const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) =>
  ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));

function when(iso) {
  if (!iso) return 'never';
  const secs = Math.round((Date.now() - new Date(iso)) / 1000);
  if (secs < 60) return secs + 's ago';
  if (secs < 3600) return Math.round(secs / 60) + 'm ago';
  if (secs < 86400) return Math.round(secs / 3600) + 'h ago';
  return Math.round(secs / 86400) + 'd ago';
}

/* Approximates how Discord will actually render the message: role mentions
   become named pills, and the common markdown is applied. */
function renderDiscord(text) {
  const roleName = (id) => {
    for (const g of (S?.guilds ?? [])) {
      const r = g.roles.find((x) => x.id === id);
      if (r) return r.name;
    }
    return 'unknown-role';
  };
  return esc(text)
    .replace(/&lt;@&amp;(\w+)&gt;/g, (_, id) => `<span class="m">@${esc(roleName(id))}</span>`)
    .replace(/&lt;@(\w+)&gt;/g, '<span class="m">@user</span>')
    .replace(/@(everyone|here)\b/g, '<span class="m">@$1</span>')
    .replace(/(https?:\/\/\S+)/g, '<a href="$1" target="_blank" rel="noopener">$1</a>')
    .replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>')
    .replace(/(^|[^*])\*([^*]+)\*/g, '$1<em>$2</em>')
    .replace(/__([^_]+)__/g, '<u>$1</u>')
    .replace(/`([^`]+)`/g, '<code>$1</code>');
}

function flash(el, text, kind) {
  el.className = 'msg show ' + kind;
  el.textContent = text;
  if (kind === 'good') setTimeout(() => { el.className = 'msg'; }, 4000);
}

/* --------------------------------------------------------------- views */
function showLogin() {
  $('login').classList.remove('hide');
  $('wizard').classList.add('hide');
  $('dash').classList.add('hide');
  $('logout').classList.add('hide');
  $('hdrsub').textContent = 'Locked';
}

async function boot() {
  const session = await fetch('/api/session').then((r) => r.json());
  if (!session.authed) return showLogin();
  await refresh();
}

async function refresh() {
  S = await api('/api/state');
  $('login').classList.add('hide');
  $('logout').classList.remove('hide');
  // "Not connected" on its own sends people to the container log. When startup
  // recorded a reason, say it here instead.
  $('hdrsub').innerHTML = S.connected
    ? `Connected as <strong>${esc(S.botTag)}</strong>`
    : `<span style="color:var(--bad)">Not connected to Discord${
        S.fault ? ` — ${esc(S.fault.message)}` : ''
      }</span>`;
  if (S.configReadOnly) {
    $('hdrsub').innerHTML +=
      '<br><span style="color:var(--bad)">/config is not writable — settings will be lost on' +
      ' restart. Check the host path mapped to /config.</span>';
  } else if (S.configFresh) {
    // Normal on a first run, and the one visible symptom of a /config mapping
    // that does not survive the container being recreated.
    $('hdrsub').innerHTML +=
      '<br><span style="color:var(--muted)">Started with no saved settings — expected on a first' +
      ' run. If that happens every time you edit the container, the host path mapped to' +
      ' <code>/config</code> is not persistent.</span>';
  }
  if (S.config.setupCompleted) renderDash(); else renderWizard();
}

$('loginform').onsubmit = async (e) => {
  e.preventDefault();
  try {
    await api('/api/login', { password: $('pw').value });
    $('loginerr').className = 'msg err';
    $('pw').value = '';
    await refresh();
  } catch (err) { flash($('loginerr'), err.message, 'err'); }
};

$('logout').onclick = async () => { await api('/api/logout', {}); location.reload(); };

/* ------------------------------------------------- shared field renderers
   Used by both the wizard and the dashboard's quick-edit sections, so the two
   can never drift apart. */

function channelOptions(guild, chosen, name) {
  if (!guild?.channels.length) return '<div class="hint">No text channels visible to the bot.</div>';
  return guild.channels.map((c) => `
    <label class="opt">
      <input type="radio" name="${name}" value="${c.id}" ${c.id === chosen ? 'checked' : ''} ${c.canPost ? '' : 'disabled'}>
      <span class="dot" style="background:${c.canPost ? 'var(--ok)' : 'var(--bad)'}"></span>
      <span class="name">#${esc(c.name)}</span>
      ${c.announcement ? '<span class="tag">announcement</span>' : ''}
      ${c.canPost ? '' : '<span class="tag">no permission</span>'}
    </label>`).join('');
}

function roleOptions(guild, current) {
  if (!guild?.roles.length) return '<div class="hint">No assignable roles in this server.</div>';
  const has = (id) => current.some((p) => p.id === id);
  return guild.roles.map((r) => `
    <label class="opt">
      <input type="checkbox" value="${r.id}" ${has(r.id) ? 'checked' : ''}>
      <span class="dot" style="background:${r.color === '#000000' ? 'var(--muted)' : r.color}"></span>
      <span class="name">@${esc(r.name)}</span>
    </label>`).join('');
}

function everyoneSwitch(guild, checked, id) {
  return `<label class="switch">
    <div><div class="t">Ping @everyone</div>
      <div class="d">${guild?.canMentionEveryone
        ? 'Use sparingly.'
        : '<span style="color:var(--warn)">Bot lacks the Mention Everyone permission — this will do nothing.</span>'}</div></div>
    <input type="checkbox" id="${id}" ${checked ? 'checked' : ''} ${guild?.canMentionEveryone ? '' : 'disabled'}>
  </label>`;
}

function filterSwitches(filters) {
  return [['retweets', 'Retweets'], ['replies', 'Replies'], ['quotes', 'Quote tweets']].map(([k, t]) =>
    `<label class="switch"><div class="t">${t}</div>
      <input type="checkbox" data-f="${k}" ${filters[k] ? 'checked' : ''}></label>`).join('');
}

function linkStyleSelect(id, current) {
  return `<select id="${id}">
    <option value="fxtwitter" ${current === 'fxtwitter' ? 'selected' : ''}>fxtwitter.com</option>
    <option value="vxtwitter" ${current === 'vxtwitter' ? 'selected' : ''}>vxtwitter.com</option>
  </select>`;
}

function modeSelect(id, current) {
  return `<select id="${id}">
    <option value="auto" ${current === 'auto' ? 'selected' : ''}>Auto — X API if available, then RSS</option>
    <option value="rss" ${current === 'rss' ? 'selected' : ''}>RSS mirrors only</option>
    <option value="xapi" ${current === 'xapi' ? 'selected' : ''}>Official X API only (needs paid token)</option>
  </select>`;
}

/* ------------------------------------------------------------ RSS feeds
   The chain is ordered and each feed can be parked without losing its URL, so
   the editor needs more than a list of text boxes: reordering, an on/off
   toggle, and a per-feed test that says what that mirror would actually post. */

/** The saved chain as [{url, enabled}], which is what the editor works on. */
function feedsFromState() {
  const src = S.config.source;
  const off = new Set(src.disabledUrls ?? []);
  return src.rssUrls.map((url) => ({ url, enabled: !off.has(url) }));
}

/** The patch fields that persist an edited chain. */
function feedPatch(feeds) {
  const kept = feeds.filter((f) => f.url.trim());
  return {
    rssUrls: kept.map((f) => f.url.trim()),
    rssDisabled: kept.filter((f) => !f.enabled).map((f) => f.url.trim())
  };
}

function isLocalFeed(url) {
  return Boolean(S.rsshub?.bundled) && url.trim() === S.rsshub.feedUrl;
}

function itemRow(it) {
  const state = it.filtered ? '<span class="pill warn">filtered</span>'
    : it.seen ? '<span class="pill">already seen</span>'
    : '<span class="pill ok">would post</span>';
  const kind = it.isRetweet ? 'RT ' : it.isReply ? 'reply ' : '';
  return `<div class="item">${state}
    <span class="txt">${esc(kind)}${esc(it.text || it.id)}</span>
    <span class="when">${it.createdAt ? esc(when(it.createdAt)) : ''}</span></div>`;
}

/**
 * Mutates `feeds` in place and repaints. `onChange` is called after any edit
 * that changes the list, so callers can refresh their own summaries.
 */
function feedEditor(box, feeds, onChange = () => {}) {
  /* Badges are recomputed in place rather than by repainting: replacing the
     row markup while a URL box has focus would swallow the click that caused
     the blur, so "type a URL, press Test" would do nothing. */
  const decorate = () => {
    const seenUrls = new Set();
    box.querySelectorAll('.feed').forEach((row, i) => {
      const feed = feeds[i];
      if (!feed) return;
      const url = feed.url.trim();
      const dupe = Boolean(url) && seenUrls.has(url);
      if (url) seenUrls.add(url);
      const bad = Boolean(url) && !/^https?:\/\//i.test(url);
      row.className = `feed${feed.enabled ? '' : ' off'}${dupe ? ' dupe' : ''}${bad ? ' bad' : ''}`;
      row.querySelector('.tags').innerHTML = [
        isLocalFeed(url) ? '<span class="pill ok">built-in RSSHub</span>' : '',
        feed.enabled ? '' : '<span class="pill warn">disabled — skipped</span>',
        dupe ? '<span class="pill bad">duplicate</span>' : '',
        bad ? '<span class="pill bad">must start with http:// or https://</span>' : ''
      ].filter(Boolean).join('');
    });
  };

  const paint = () => {
    if (!feeds.length) {
      box.innerHTML = '<p class="hint" style="margin:0 0 8px">No feeds yet — add one below.</p>';
      return;
    }
    box.innerHTML = feeds.map((f, i) => `
      <div class="feed" data-i="${i}">
        <div class="top">
          <input type="checkbox" data-on="${i}" ${f.enabled ? 'checked' : ''} title="Enable or disable this feed">
          <input type="text" data-url="${i}" value="${esc(f.url)}" placeholder="https://…" spellcheck="false">
          <button class="icon" type="button" data-up="${i}" title="Move up" ${i === 0 ? 'disabled' : ''}>↑</button>
          <button class="icon" type="button" data-down="${i}" title="Move down" ${i === feeds.length - 1 ? 'disabled' : ''}>↓</button>
          <button type="button" data-test="${i}">Test</button>
          <button class="icon" type="button" data-del="${i}" title="Remove">✕</button>
        </div>
        <div class="tags"></div>
        <div class="res" data-res="${i}"></div>
      </div>`).join('');
    decorate();

    box.querySelectorAll('[data-url]').forEach((inp) => {
      inp.oninput = () => { feeds[+inp.dataset.url].url = inp.value; decorate(); onChange(); };
    });
    box.querySelectorAll('[data-on]').forEach((inp) => {
      inp.onchange = () => { feeds[+inp.dataset.on].enabled = inp.checked; decorate(); onChange(); };
    });
    const move = (from, to) => {
      if (to < 0 || to >= feeds.length) return;
      feeds.splice(to, 0, feeds.splice(from, 1)[0]);
      paint();
      onChange();
    };
    box.querySelectorAll('[data-up]').forEach((b) => { b.onclick = () => move(+b.dataset.up, +b.dataset.up - 1); });
    box.querySelectorAll('[data-down]').forEach((b) => { b.onclick = () => move(+b.dataset.down, +b.dataset.down + 1); });
    box.querySelectorAll('[data-del]').forEach((b) => {
      b.onclick = () => { feeds.splice(+b.dataset.del, 1); paint(); onChange(); };
    });
    box.querySelectorAll('[data-test]').forEach((b) => {
      b.onclick = () => testFeed(b, feeds[+b.dataset.test], box.querySelector(`[data-res="${b.dataset.test}"]`));
    });
  };
  paint();
  return paint;
}

/** Tests one feed as typed, without saving it first. */
async function testFeed(btn, feed, out) {
  const url = feed.url.trim();
  if (!/^https?:\/\//i.test(url)) {
    out.innerHTML = '<div class="note bad">Enter an http(s) URL first.</div>';
    return;
  }
  out.innerHTML = '<div class="note">Fetching…</div>';
  await run(btn, '…', async () => {
    const r = await api('/api/action', { action: 'feed-test', url });
    if (!r.ok) {
      out.innerHTML = `<div class="note bad">Failed after ${r.ms}ms — ${esc(r.error)}</div>` +
        (r.hint ? `<div class="note">${esc(r.hint)}</div>` : '');
      return;
    }
    out.innerHTML =
      `<div class="note">${r.count} post(s) in ${r.ms}ms${feed.enabled ? '' : ' — this feed is disabled, so the poller skips it'}</div>` +
      `<div class="items">${r.items.map(itemRow).join('')}</div>`;
  });
}

/** Preset picker + add button. Returns nothing; wires itself to `feeds`. */
function feedAdder(el, feeds, repaint, onChange = () => {}) {
  const sel = el.querySelector('[data-preset]');
  const btn = el.querySelector('[data-add]');
  if (!sel || !btn) return;
  btn.onclick = () => {
    const url = sel.value;
    if (url && feeds.some((f) => f.url.trim() === url)) {
      flash(msgEl(), 'That feed is already in the list.', 'err');
      return;
    }
    feeds.push({ url, enabled: true });
    repaint();
    onChange();
    // A blank row wants typing in straight away.
    if (!url) el.querySelector('.feed:last-child input[type=text]')?.focus();
  };
}

function feedAdderMarkup() {
  const presets = S.feedPresets ?? [];
  return `<div class="row" style="margin-top:10px">
    <select data-preset>
      <option value="">Custom feed — type the URL yourself</option>
      ${presets.map((p) => `<option value="${esc(p.url)}">${esc(p.label)} — ${esc(p.url)}</option>`).join('')}
    </select>
    <button class="small" type="button" data-add style="flex:0 0 auto">+ Add feed</button>
  </div>`;
}

/* Timeout / item cap / user agent — the knobs that decide whether a slow or
   picky mirror works at all. */
function fetchSettingsMarkup(prefix) {
  const s = S.config.source.rss ?? {};
  const lim = S.rssLimits ?? { timeoutSeconds: [5, 120], maxItems: [1, 100] };
  return `<label>Fetch settings</label>
    <div class="row">
      <div><label for="${prefix}_to" style="margin-top:0">Timeout (seconds)</label>
        <input type="number" id="${prefix}_to" min="${lim.timeoutSeconds[0]}" max="${lim.timeoutSeconds[1]}" value="${s.timeoutSeconds ?? 20}"></div>
      <div><label for="${prefix}_max" style="margin-top:0">Newest items per fetch</label>
        <input type="number" id="${prefix}_max" min="${lim.maxItems[0]}" max="${lim.maxItems[1]}" value="${s.maxItems ?? 20}"></div>
    </div>
    <label for="${prefix}_ua">User agent</label>
    <input type="text" id="${prefix}_ua" value="${esc(s.userAgent ?? '')}" placeholder="${esc(S.rssDefaultUserAgent ?? '')}">
    <p class="hint" style="margin:6px 0 0">Some mirrors block unfamiliar clients. Leave blank for the default.</p>`;
}

function fetchSettingsPatch(el, prefix) {
  return {
    rssSettings: {
      timeoutSeconds: el.querySelector(`#${prefix}_to`).value,
      maxItems: el.querySelector(`#${prefix}_max`).value,
      userAgent: el.querySelector(`#${prefix}_ua`).value
    }
  };
}

/* The bundled RSSHub's state, plus why it might not be usable. */
function rsshubBlock() {
  const h = S.rsshub ?? {};
  if (!h.bundled) {
    return `<p class="hint" style="margin:12px 0 0">This image has no built-in RSSHub. Run one yourself
      and point a feed at it, e.g. <code>http://192.168.1.50:1200/twitter/user/${esc(S.config.handle)}</code></p>`;
  }
  const pill = !h.enabled ? '<span class="pill">disabled</span>'
    : h.ready ? '<span class="pill ok">running</span>'
    : h.running ? '<span class="pill warn">starting…</span>'
    : '<span class="pill bad">stopped</span>';
  return `<div class="result" style="margin-top:12px">${pill}<div class="body">
    <div class="src">Built-in RSSHub — <code>${esc(h.url ?? '')}</code></div>
    <div class="det">${h.enabled
      ? esc(h.lastError ?? 'Runs inside this container, so it is not shared with anyone else.')
      : 'Turned off with the RSSHUB_ENABLED variable.'}</div></div></div>
    <div class="row" style="margin-top:10px">
      <button class="small" type="button" id="usehub">Use built-in feed</button>
      <button class="small" type="button" id="restarthub">Restart RSSHub</button>
    </div>
    ${authTokenBlock()}`;
}

/* RSSHub's X route needs a session cookie of its own, and X expires them often.
   Editing it here — rather than in the container — is the difference between a
   30-second fix and recreating the container every time it lapses. */
function authTokenBlock() {
  const t = S.rsshub?.authToken ?? {};
  const pill = !t.present ? '<span class="pill bad">not set</span>'
    : t.source === 'env' ? '<span class="pill warn">from the container</span>'
    : '<span class="pill ok">saved here</span>';
  const state = !t.present
    ? 'Without it the built-in RSSHub answers <strong>503</strong> to every X request.'
    : t.source === 'env'
      ? `Supplied by <code>TWITTER_AUTH_TOKEN</code> on the container (${esc(t.preview ?? '')}).
         Saving one here replaces it until you clear it again.`
      : `Saved in the bot's config (${esc(t.preview ?? '')})${t.envPresent
          ? ', and used instead of the container\'s <code>TWITTER_AUTH_TOKEN</code>' : ''}.`;
  return `<label style="margin-top:18px">X session token ${pill}</label>
    <p class="hint" style="margin:0 0 8px">${state}
      Log in to <a href="https://x.com" target="_blank" rel="noopener">x.com</a>, open your browser's
      developer tools → <em>Application</em> → <em>Cookies</em> → <code>x.com</code>, and copy the
      value of <code>auth_token</code>. Pasting the whole <code>auth_token=…</code> pair works too.
      It is stored in <code>config.json</code> and never shown again.</p>
    <input type="password" data-tok autocomplete="off" spellcheck="false"
      placeholder="${t.present ? 'Saved — paste a new one to replace it' : 'auth_token cookie value'}">
    <div class="row" style="margin-top:8px">
      <button class="small primary" type="button" data-savetok style="flex:0 0 auto">Save token</button>
      ${t.source === 'config'
        ? '<button class="small" type="button" data-cleartok style="flex:0 0 auto">Clear</button>'
        : ''}
      <span style="flex:1"></span>
    </div>`;
}

function wireRsshubButtons(el, onUse) {
  const use = el.querySelector('#usehub');
  if (use) use.onclick = () => onUse(S.rsshub.feedUrl);
  const restart = el.querySelector('#restarthub');
  if (restart) restart.onclick = () => run(restart, 'Restarting…', async () => {
    const r = await api('/api/action', { action: 'rsshub-restart' });
    flash(msgEl(), r.ok ? 'RSSHub restarting — give it up to a minute.' : r.error, r.ok ? 'good' : 'err');
  });

  const input = el.querySelector('[data-tok]');
  const saveTok = el.querySelector('[data-savetok]');
  if (saveTok) saveTok.onclick = () => run(saveTok, 'Saving…', async () => {
    if (!input.value.trim()) return flash(msgEl(), 'Paste the auth_token value first.', 'err');
    if (!await save({ twitterAuthToken: input.value })) return;
    input.value = '';
    flash(msgEl(), 'Token saved. RSSHub is restarting with it — give it up to a minute, then test the feed.', 'good');
    await refresh();
  });

  const clearTok = el.querySelector('[data-cleartok]');
  if (clearTok) clearTok.onclick = () => run(clearTok, 'Clearing…', async () => {
    if (!await save({ twitterAuthToken: '' })) return;
    flash(msgEl(), 'Token cleared. RSSHub is restarting without it.', 'good');
    await refresh();
  });
}

/* Whichever message banner is currently on screen. */
function msgEl() {
  return $('dash').classList.contains('hide') ? $('werr') : $('dashmsg');
}

/* -------------------------------------------------------------- wizard */
const STEPS = ['Welcome', 'Channel', 'Pings', 'Source', 'Options', 'Finish'];

function renderWizard() {
  $('wizard').classList.remove('hide');
  $('dash').classList.add('hide');
  $('steps').innerHTML = STEPS.map((_, i) => `<div class="${i <= step ? 'done' : ''}"></div>`).join('');
  $('werr').className = 'msg';
  const body = $('stepbody');
  body.innerHTML = '';
  body.appendChild(({
    0: stepWelcome, 1: stepChannel, 2: stepPings,
    3: stepSource, 4: stepOptions, 5: stepFinish
  })[step]());
}

function card(title, hint, inner) {
  const el = document.createElement('div');
  el.className = 'card';
  el.innerHTML = `<h2>${title}</h2><p class="hint">${hint}</p>` + inner;
  return el;
}

function nav(el, { back = true, next = 'Continue', onNext, disabled = false, extra = '' }) {
  const bar = document.createElement('div');
  bar.className = 'actions';
  bar.innerHTML =
    (extra ? `<div class="left">${extra}</div>` : '<div class="left"></div>') +
    (back ? '<button id="wb">Back</button>' : '') +
    `<button class="primary" id="wn" ${disabled ? 'disabled' : ''}>${next}</button>`;
  el.appendChild(bar);
  // Query within `bar`, not the document: `el` is not attached to the DOM yet.
  if (back) bar.querySelector('#wb').onclick = () => { step--; renderWizard(); };
  bar.querySelector('#wn').onclick = onNext;
  return bar;
}

/* Step 0 — welcome */
function stepWelcome() {
  const invite = S.clientId
    ? `https://discord.com/api/oauth2/authorize?client_id=${S.clientId}&permissions=277025770496&scope=bot%20applications.commands`
    : null;
  const noGuilds = !S.guilds.length;
  const el = card('Welcome', 'This wizard configures everything the bot needs. It takes about a minute.',
    `<div class="grid">
      <div class="stat"><div class="k">Discord</div><div class="v">${S.connected
        ? '<span class="pill ok">Connected</span>' : '<span class="pill bad">Offline</span>'}</div></div>
      <div class="stat"><div class="k">Servers</div><div class="v">${S.guilds.length}</div></div>
      <div class="stat"><div class="k">X API token</div><div class="v">${S.hasXToken
        ? '<span class="pill ok">Present</span>' : '<span class="pill warn">Not set — RSS only</span>'}</div></div>
    </div>` +
    (noGuilds
      ? `<div class="msg show info" style="margin-top:16px">The bot is not in a server yet.
          ${invite ? `<a href="${invite}" target="_blank" rel="noopener">Invite it here</a>, then reload this page.`
                   : 'Set <code>DISCORD_CLIENT_ID</code> to generate an invite link.'}</div>`
      : ''));
  nav(el, { back: false, next: 'Start', disabled: noGuilds, onNext: () => { step = 1; renderWizard(); },
    extra: noGuilds ? '<button id="reload" class="ghost">Reload</button>' : '' });
  const r = el.querySelector('#reload');
  if (r) r.onclick = () => location.reload();
  return el;
}

/* Step 1 — server + channel */
function stepChannel() {
  const gid = draft.guildId ?? S.config.guildId ?? S.guilds[0]?.id;
  const guild = S.guilds.find((g) => g.id === gid) ?? S.guilds[0];
  const chosen = draft.channelId ?? S.config.channelId;

  const el = card('Where should posts go?', 'Pick the channel the bot announces new posts in.',
    (S.guilds.length > 1
      ? `<label for="gsel">Server</label><select id="gsel">${S.guilds.map((g) =>
          `<option value="${g.id}" ${g.id === guild.id ? 'selected' : ''}>${esc(g.name)}</option>`).join('')}</select>`
      : '') +
    `<label>Channel</label>
    <div class="list" id="chlist">${channelOptions(guild, chosen, 'ch')}</div>
    <p class="hint" style="margin:10px 0 0">Channels the bot cannot post in are disabled. Grant it
      <strong>View Channel</strong> and <strong>Send Messages</strong> there, then reload.</p>`);

  const sel = el.querySelector('#gsel');
  if (sel) sel.onchange = () => { draft.guildId = sel.value; draft.channelId = null; renderWizard(); };

  nav(el, { onNext: async () => {
    const picked = el.querySelector('input[name=ch]:checked');
    if (!picked) return flash($('werr'), 'Pick a channel to continue.', 'err');
    draft.guildId = guild.id;
    draft.channelId = picked.value;
    await save({ guildId: guild.id, channelId: picked.value });
    step = 2; renderWizard();
  }});
  return el;
}

/* Step 2 — pings */
function stepPings() {
  const guild = S.guilds.find((g) => g.id === (draft.guildId ?? S.config.guildId)) ?? S.guilds[0];
  const current = draft.pings ?? S.config.pings;
  const everyone = draft.mentionEveryone ?? S.config.mentionEveryone;

  const el = card('Who gets pinged?', 'Selected roles are mentioned on every new post. Leave empty for a silent post.',
    everyoneSwitch(guild, everyone, 'evy') +
    `<label>Roles</label>
    <div class="list" id="rolelist">${roleOptions(guild, current)}</div>`);

  nav(el, { onNext: async () => {
    const pings = [...el.querySelectorAll('#rolelist input:checked')].map((i) => ({ type: 'role', id: i.value }));
    const mentionEveryone = el.querySelector('#evy').checked;
    draft.pings = pings; draft.mentionEveryone = mentionEveryone;
    await save({ pings, mentionEveryone });
    step = 3; renderWizard();
  }});
  return el;
}

/* Step 3 — source */
function stepSource() {
  const feeds = draft.feeds ?? (draft.feeds = feedsFromState());
  const mode = draft.sourceMode ?? S.config.source.mode;

  const el = card('How should the bot detect new posts?',
    'X removed free API access to timelines, so the bot falls back through RSS mirrors. Test them here.',
    `<label for="mode">Strategy</label>${modeSelect('mode', mode)}
    ${S.hasXToken ? '' : '<p class="hint" style="margin:8px 0 0">No <code>X_BEARER_TOKEN</code> is set, so the X API will be skipped.</p>'}
    <label>RSS feeds — tried in order, first one that answers wins</label>
    <div id="urls"></div>
    ${feedAdderMarkup()}
    ${rsshubBlock()}
    <div class="results" id="testres"></div>`);

  const paint = feedEditor(el.querySelector('#urls'), feeds);
  feedAdder(el, feeds, paint);
  wireRsshubButtons(el, (feed) => {
    if (!feeds.some((f) => f.url.trim() === feed)) feeds.unshift({ url: feed, enabled: true });
    paint();
  });

  const testBtn = document.createElement('button');
  testBtn.textContent = 'Test these sources';
  testBtn.type = 'button';

  nav(el, { onNext: async () => {
    draft.sourceMode = el.querySelector('#mode').value;
    await save({ ...feedPatch(feeds), sourceMode: draft.sourceMode });
    step = 4; renderWizard();
  }});
  el.querySelector('.actions .left').appendChild(testBtn);

  testBtn.onclick = async () => {
    testBtn.disabled = true; testBtn.textContent = 'Testing…';
    try {
      await save({ ...feedPatch(feeds), sourceMode: el.querySelector('#mode').value }, true);
      const { results } = await api('/api/action', { action: 'test' });
      el.querySelector('#testres').innerHTML = results.map(renderResult).join('');
    } catch (err) { flash($('werr'), err.message, 'err'); }
    testBtn.disabled = false; testBtn.textContent = 'Test these sources';
  };
  return el;
}

function renderResult(r) {
  const icon = r.skipped ? '<span class="pill">skipped</span>'
    : r.ok ? '<span class="pill ok">works</span>' : '<span class="pill bad">failed</span>';
  return `<div class="result">${icon}<div class="body">
    <div class="src">${esc(r.source)}</div><div class="det">${esc(r.detail)}</div></div></div>`;
}

/* Step 4 — options */
function stepOptions() {
  const c = S.config;
  const el = card('Options', 'All of this can be changed later, here or with <code>/fihas</code> in Discord.',
    `<div class="row">
      <div><label for="handle">X account to watch</label><input type="text" id="handle" value="${esc(draft.handle ?? c.handle)}"></div>
      <div><label for="interval">Check every (seconds)</label><input type="number" id="interval" min="30" max="86400" value="${draft.intervalSeconds ?? c.intervalSeconds}"></div>
    </div>
    <label>Post types</label>
    ${filterSwitches({ ...c.filters, ...(draft.filters ?? {}) })}
    <label for="link">Link style</label>
    ${linkStyleSelect('link', draft.linkStyle ?? c.linkStyle)}
    <label for="tpl">Message template</label>
    <textarea id="tpl">${esc(draft.messageTemplate ?? c.messageTemplate)}</textarea>
    <p class="hint" style="margin:6px 0 0">Placeholders: <code>{pings}</code> <code>{handle}</code> <code>{link}</code> <code>{text}</code></p>
    <div class="preview" id="prev">…</div>`);

  const tpl = el.querySelector('#tpl');
  const doPreview = async () => {
    try {
      const { rendered } = await api('/api/action', { action: 'preview', template: tpl.value });
      el.querySelector('#prev').innerHTML = renderDiscord(rendered);
    } catch {}
  };
  tpl.oninput = () => { clearTimeout(tpl._t); tpl._t = setTimeout(doPreview, 300); };
  doPreview();

  nav(el, { onNext: async () => {
    const filters = {};
    el.querySelectorAll('[data-f]').forEach((i) => { filters[i.dataset.f] = i.checked; });
    const patch = {
      handle: el.querySelector('#handle').value,
      intervalSeconds: el.querySelector('#interval').value,
      linkStyle: el.querySelector('#link').value,
      messageTemplate: tpl.value,
      filters
    };
    if (await save(patch)) { step = 5; renderWizard(); }
  }});
  return el;
}

/* Step 5 — finish */
function stepFinish() {
  const c = S.config;
  const el = card('Ready', 'Run a first check to confirm everything works, then finish.',
    `<div class="grid">
      <div class="stat"><div class="k">Watching</div><div class="v">@${esc(c.handle)}</div></div>
      <div class="stat"><div class="k">Channel</div><div class="v">#${esc(channelName(c.channelId))}</div></div>
      <div class="stat"><div class="k">Pinging</div><div class="v">${describePings(c)}</div></div>
      <div class="stat"><div class="k">Interval</div><div class="v">every ${c.intervalSeconds}s</div></div>
    </div>
    <div class="msg show info" style="margin-top:16px">The first check records existing posts as
      already-seen without announcing them, so starting the bot never floods your channel. Anything
      posted after that gets announced.</div>
    <div class="results" id="fres"></div>`);

  const runBtn = document.createElement('button');
  runBtn.textContent = 'Run first check';
  runBtn.type = 'button';

  nav(el, { next: 'Finish setup', onNext: async () => {
    await save({ setupCompleted: true });
    await refresh();
  }});
  el.querySelector('.actions .left').appendChild(runBtn);

  runBtn.onclick = async () => {
    runBtn.disabled = true; runBtn.textContent = 'Checking…';
    const r = await api('/api/action', { action: 'check' });
    el.querySelector('#fres').innerHTML = r.ok === false
      ? renderResult({ source: 'Check failed', ok: false, detail: r.error })
      : renderResult({ source: r.bootstrap ? 'Bootstrapped' : 'Checked', ok: true,
          detail: r.bootstrap
            ? `Recorded ${r.skipped} existing post(s) via ${r.sourceUsed}. Nothing was posted.`
            : `${r.posted} posted, ${r.skipped} filtered, via ${r.sourceUsed}` });
    runBtn.disabled = false; runBtn.textContent = 'Run first check';
  };
  return el;
}

/* `rss:https://host/very/long/path` is mostly noise in a stat tile. */
function shortSource(label) {
  if (!label) return 'none yet';
  if (!label.startsWith('rss:')) return label;
  const url = label.slice(4);
  if (isLocalFeed(url)) return 'built-in RSSHub';
  try { return new URL(url).hostname; } catch { return url; }
}

function channelName(id) {
  for (const g of S.guilds) { const c = g.channels.find((x) => x.id === id); if (c) return c.name; }
  return id ? 'unknown' : 'not set';
}

function describePings(c) {
  const names = [];
  if (c.mentionEveryone) names.push('@everyone');
  for (const p of c.pings) {
    let found = null;
    for (const g of S.guilds) { const r = g.roles.find((x) => x.id === p.id); if (r) found = '@' + r.name; }
    names.push(esc(found ?? p.id));
  }
  return names.length ? names.join(', ') : 'nobody';
}

/* Persist a patch. Returns true on success. */
async function save(patch, quiet) {
  try {
    const out = await api('/api/config', patch);
    S = out.state;
    return true;
  } catch (err) {
    // Whichever banner is on screen — the wizard's and the dashboard's differ.
    if (!quiet) flash(msgEl(), err.message, 'err');
    return false;
  }
}

    $('dresults').innerHTML = results.map(renderResult).join('');
  });

  $('dashedit').innerHTML = '';
  for (const build of [secDestination, secPings, secSources, secOptions, secCommands]) {
    $('dashedit').appendChild(build());
  }
}

async function run(btn, busy, fn) {
  const label = btn.textContent;
  btn.disabled = true; btn.textContent = busy;
  try { await fn(); } catch (err) { flash(msgEl(), err.message, 'err'); }
  btn.disabled = false; btn.textContent = label;
}

/* ------------------------------------------------- quick-edit sections
   Every setting the wizard collects, editable in place without re-running it.
   Each section saves on its own so one bad value cannot block the rest. */

function section(id, title, summary, inner) {
  const el = document.createElement('details');
  el.className = 'card';
  el.open = openSections.has(id);
  el.innerHTML =
    `<summary><span class="chev">▶</span><span class="st">${title}</span>
      <span class="sv">${summary}</span></summary>
     <div class="inner">${inner}</div>`;
  el.addEventListener('toggle', () => {
    if (el.open) openSections.add(id); else openSections.delete(id);
  });
  return el;
}

/* Appends a save button and wires it to `fn`, which returns the patch to send. */
function saveBar(el, fn, label = 'Save') {
  const bar = document.createElement('div');
  bar.className = 'actions';
  bar.innerHTML = `<button class="primary">${label}</button>`;
  el.querySelector('.inner').appendChild(bar);
  const btn = bar.querySelector('button');
  btn.onclick = () => run(btn, 'Saving…', async () => {
    const patch = await fn();
    if (!patch) return;
    if (await save(patch)) { flash($('dashmsg'), 'Saved.', 'good'); await refresh(); }
    else flash($('dashmsg'), 'Could not save — check the values.', 'err');
  });
  return bar;
}

function dashGuild() {
  return S.guilds.find((g) => g.id === (dashGuildId ?? S.config.guildId)) ?? S.guilds[0];
}

function secDestination() {
  const c = S.config;
  const guild = dashGuild();
  const el = section('dest', 'Destination', `#${esc(channelName(c.channelId))}`,
    (S.guilds.length > 1
      ? `<label for="d_g">Server</label><select id="d_g">${S.guilds.map((g) =>
          `<option value="${g.id}" ${g.id === guild?.id ? 'selected' : ''}>${esc(g.name)}</option>`).join('')}</select>`
      : '') +
    `<label>Channel</label>
     <div class="list">${channelOptions(guild, c.channelId, 'dch')}</div>
     <p class="hint" style="margin:10px 0 0">Channels the bot cannot post in are disabled.</p>`);

  const sel = el.querySelector('#d_g');
  if (sel) sel.onchange = () => { dashGuildId = sel.value; renderDash(); };

  saveBar(el, () => {
    // The bot can be removed from a server while the dashboard is open.
    if (!guild) { flash($('dashmsg'), 'The bot is not in a server any more.', 'err'); return null; }
    const picked = el.querySelector('input[name=dch]:checked');
    if (!picked) { flash($('dashmsg'), 'Pick a channel first.', 'err'); return null; }
    return { guildId: guild.id, channelId: picked.value };
  });
  return el;
}

function secPings() {
  const c = S.config;
  const guild = dashGuild();
  const el = section('pings', 'Pings', describePings(c),
    everyoneSwitch(guild, c.mentionEveryone, 'd_evy') +
    `<label>Roles</label><div class="list">${roleOptions(guild, c.pings)}</div>
     <p class="hint" style="margin:10px 0 0">Users can be added with
       <code>/fihas ping add</code> in Discord.</p>`);

  saveBar(el, () => ({
    // Roles come from the checkboxes; keep any users added from Discord.
    pings: [
      ...[...el.querySelectorAll('.list input:checked')].map((i) => ({ type: 'role', id: i.value })),
      ...c.pings.filter((p) => p.type === 'user')
    ],
    mentionEveryone: el.querySelector('#d_evy').checked
  }));
  return el;
}

function secSources() {
  const c = S.config;
  const feeds = feedsFromState();
  const live = feeds.filter((f) => f.enabled).length;
  const el = section('src', 'RSS & sources',
    `${esc(c.source.mode)} · ${live}/${feeds.length} feed(s) active`,
    `<label for="d_mode">Strategy</label>${modeSelect('d_mode', c.source.mode)}
     ${S.hasXToken ? '' : '<p class="hint" style="margin:8px 0 0">No <code>X_BEARER_TOKEN</code> is set, so the X API is skipped.</p>'}
     <label>RSS feeds — tried in order, first one that answers wins</label>
     <div id="d_urls"></div>
     <p class="hint" id="d_feedsum" style="margin:2px 0 0"></p>
     ${feedAdderMarkup()}
     ${rsshubBlock()}
     ${fetchSettingsMarkup('d')}
     <div class="results" id="d_testres"></div>`);

  const summarise = () => {
    const on = feeds.filter((f) => f.enabled && f.url.trim()).length;
    el.querySelector('#d_feedsum').textContent = on
      ? `${on} of ${feeds.length} feed(s) will be tried, in this order. Unsaved changes are kept when you press Save.`
      : 'Every feed is disabled — the poller has nothing to try.';
  };
  const paint = feedEditor(el.querySelector('#d_urls'), feeds, summarise);
  feedAdder(el, feeds, paint, summarise);
  summarise();
  wireRsshubButtons(el, (feed) => {
    const existing = feeds.find((f) => f.url.trim() === feed);
    if (existing) existing.enabled = true;
    else feeds.unshift({ url: feed, enabled: true });
    paint();
    summarise();
  });

  const patch = () => ({
    sourceMode: el.querySelector('#d_mode').value,
    ...feedPatch(feeds),
    ...fetchSettingsPatch(el, 'd')
  });

  const bar = saveBar(el, patch);

  const testBtn = document.createElement('button');
  testBtn.type = 'button';
  testBtn.textContent = 'Test all sources';
  testBtn.className = 'left';
  bar.prepend(testBtn);
  testBtn.onclick = () => run(testBtn, 'Testing…', async () => {
    // Test what is on screen, not what was last saved.
    if (!await save(patch(), true)) {
      flash($('dashmsg'), 'Fix the highlighted feed settings first.', 'err');
      return;
    }
    const { results } = await api('/api/action', { action: 'test' });
    el.querySelector('#d_testres').innerHTML = results.map(renderResult).join('');
  });
  return el;
}

function secOptions() {
  const c = S.config;
  const el = section('opts', 'Posting options',
    `@${esc(c.handle)} · every ${c.intervalSeconds}s · ${esc(c.linkStyle)}`,
    `<div class="row">
      <div><label for="e_handle">X account</label><input type="text" id="e_handle" value="${esc(c.handle)}"></div>
      <div><label for="e_int">Check every (seconds)</label><input type="number" id="e_int" min="30" max="86400" value="${c.intervalSeconds}"></div>
    </div>
    <label>Post types</label>
    ${filterSwitches(c.filters)}
    <label for="e_link">Link style</label>
    ${linkStyleSelect('e_link', c.linkStyle)}
    <label for="e_tpl">Message template</label>
    <textarea id="e_tpl">${esc(c.messageTemplate)}</textarea>
    <p class="hint" style="margin:6px 0 0">Placeholders: <code>{pings}</code> <code>{handle}</code> <code>{link}</code> <code>{text}</code></p>
    <div class="preview" id="e_prev">…</div>`);

  const tpl = el.querySelector('#e_tpl');
  const doPreview = async () => {
    try {
      const { rendered } = await api('/api/action', { action: 'preview', template: tpl.value });
      el.querySelector('#e_prev').innerHTML = renderDiscord(rendered);
    } catch {}
  };
  tpl.oninput = () => { clearTimeout(tpl._t); tpl._t = setTimeout(doPreview, 300); };
  if (el.open) doPreview(); else el.addEventListener('toggle', doPreview, { once: true });

  saveBar(el, () => {
    const filters = {};
    el.querySelectorAll('[data-f]').forEach((i) => { filters[i.dataset.f] = i.checked; });
    return {
      handle: el.querySelector('#e_handle').value,
      intervalSeconds: el.querySelector('#e_int').value,
      linkStyle: el.querySelector('#e_link').value,
      messageTemplate: tpl.value,
      filters
    };
  });
  return el;
}

function secCommands() {
  const c = S.config;
  const p = esc(c.prefix);
  const intent = {
    active: '<div class="msg show good">Discord is sending message text — prefix commands are live.</div>',
    denied: `<div class="msg show err">Discord refused the <strong>Message Content</strong> intent, so the bot
      cannot read messages. Enable <strong>MESSAGE CONTENT INTENT</strong> under <em>Bot → Privileged Gateway
      Intents</em> in the <a href="https://discord.com/developers/applications" target="_blank" rel="noopener">Developer
      Portal</a>, then restart the container.</div>`,
    off: c.prefixEnabled
      ? '<div class="msg show info">Restart the container to start listening — the message intent is only requested at startup.</div>'
      : '<div class="msg show info">Prefix commands are off. Turn them on and restart the container to use them.</div>'
  }[S.messageIntent ?? 'off'];

  const el = section('cmds', 'Commands',
    c.prefixEnabled ? `/fihas · ${p}` : '/fihas only',
    `${intent}
     <label class="switch"><div><div class="t">Text-prefix commands</div>
       <div class="d">A fallback for servers where <code>/fihas</code> never appears.</div></div>
       <input type="checkbox" id="d_pfxon" ${c.prefixEnabled ? 'checked' : ''}></label>
     <label for="d_pfx">Prefix</label>
     <input type="text" id="d_pfx" value="${p}" maxlength="16">
     <p class="hint" style="margin:6px 0 0">No spaces, <code>@</code>, <code>#</code> or backticks.
       Examples: <code>!fihas</code>, <code>!f</code>, <code>fihas!</code></p>
     <div class="cmds" style="margin-top:14px">
       <code>${p} help</code> · <code>${p} status</code> · <code>${p} check</code> · <code>${p} test</code><br>
       <code>${p} latest [ping]</code> · <code>${p} pause</code> · <code>${p} resume</code><br>
       <code>${p} channel set #channel</code> · <code>${p} ping add @role</code><br>
       <code>${p} source mode auto|xapi|rss</code> · <code>${p} source add &lt;url&gt;</code><br>
       <code>${p} set interval 120</code> · <code>${p} set handle name</code>
     </div>
     <p class="hint" style="margin:12px 0 0">Prefix commands need <strong>Manage Server</strong>, same as the
       slash commands, and their replies are visible to the channel.</p>`);

  saveBar(el, () => ({
    prefix: el.querySelector('#d_pfx').value,
    prefixEnabled: el.querySelector('#d_pfxon').checked
  }));
  return el;
}

boot().catch((err) => { $('hdrsub').textContent = 'Error: ' + err.message; });
</script>
