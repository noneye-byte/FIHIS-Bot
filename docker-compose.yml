services:
  fihas-bot:
    build: .
    image: fihas-bot:latest
    container_name: fihas-bot
    restart: unless-stopped
    environment:
      DISCORD_TOKEN: ${DISCORD_TOKEN}
      DISCORD_CLIENT_ID: ${DISCORD_CLIENT_ID}
      DISCORD_GUILD_ID: ${DISCORD_GUILD_ID:-}
      WEB_PASSWORD: ${WEB_PASSWORD:-}
      X_BEARER_TOKEN: ${X_BEARER_TOKEN:-}
      X_HANDLE: ${X_HANDLE:-F_I_H_A_S}
      DISCORD_CHANNEL_ID: ${DISCORD_CHANNEL_ID:-}
      PING_ROLE_ID: ${PING_ROLE_ID:-}
      POLL_INTERVAL_SECONDS: ${POLL_INTERVAL_SECONDS:-120}
      RSS_URLS: ${RSS_URLS:-}
      # Feed fetch tuning. Left blank on purpose: these are edited under
      # "RSS & sources" in the web UI, and a value here overrides that on every
      # restart. Set them only if you want the container to own the setting.
      RSS_TIMEOUT_SECONDS: ${RSS_TIMEOUT_SECONDS:-}
      RSS_MAX_ITEMS: ${RSS_MAX_ITEMS:-}
      RSS_USER_AGENT: ${RSS_USER_AGENT:-}
      # Text commands, for servers where /fihas never shows up. Needs the
      # Message Content intent enabled in the Discord Developer Portal.
      COMMAND_PREFIX: ${COMMAND_PREFIX:-!fihas}
      PREFIX_ENABLED: ${PREFIX_ENABLED:-true}
      # RSSHub is built into this image and runs as a child process. It only
      # serves this container, so it never gets rate-limited by other people.
      RSSHUB_ENABLED: ${RSSHUB_ENABLED:-true}
      RSSHUB_PORT: ${RSSHUB_PORT:-1200}
      # RSSHub's X route needs credentials of its own — an auth_token cookie
      # from a logged-in session. Every other RSSHub variable is passed through
      # to it untouched as well.
      TWITTER_AUTH_TOKEN: ${TWITTER_AUTH_TOKEN:-}
      TZ: ${TZ:-Etc/UTC}
    volumes:
      - ./config:/config
    ports:
      - "8080:8080"
      # Only needed if you want to reach the bundled RSSHub from other machines;
      # the bot itself talks to it over 127.0.0.1 inside the container.
      # - "1200:1200"
